name: nasa-images

# NASA Image Library 主题精选抓取管道。
# 和 APOD/EPIC、GCAT 一样是「外部 API、低频更新」，单独一条 workflow，
# 不挤占 sync.yml 的 LL2 配额，也不与 nasa-daily.yml / gcat.yml 撞车。
#
# 触发方式：
#   1. 定时：每月 1 号 UTC 04:00 = 北京 12:00 跑一次（主题精选，一个月足够新鲜）
#   2. push：改动 scripts/nasa-images.js 或本工作流文件即触发（首推即跑，不用等 cron）
#   3. 手动：workflow_dispatch 直接跑
#
# 产物（上传到 COS space-data/）：
#   nasa-images.json  按主题精选的 NASA 影像（阿波罗/哈勃/韦伯/火星/星云/地球），
#                      每条带标题/说明/日期/缩略图/大图（均已镜像到 COS）
#
# 注意：cron 用 UTC。北京时间 = UTC+8

on:
  schedule:
    - cron: '0 4 1 * *'    # 每月 1 号 UTC 04:00 = 北京 12:00
  push:
    paths:
      - 'scripts/nasa-images.js'
      - '.github/workflows/nasa-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasa-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 星云单主题约 316 张 × 两种尺寸镜像，并发 4，留足余量
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: 抓取 NASA 影像并上传
        working-directory: scripts
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          # 桶本身是私有读，靠单个对象打 public-read 让小程序能拉到
          COS_ACL: public-read
          # 每个主题最多取多少张（星云检索总命中约 316，取满）
          NASA_IMG_PER_THEME: '400'
        run: node nasa-images.js
