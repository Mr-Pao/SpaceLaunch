name: archive-history

# 历史发射归档
#
# 为什么单独一个 workflow：
# LL2 免费额度 15 次/小时、每次最多 100 条，全部历史 7654 条约 77 页。
# 一次跑完必然 429，所以拆成「每小时跑 8 页、断点续传」，
# 约 10 小时补齐，之后 state.done=true 就自动跳过。
#
# 配额分配（每小时）：
#   upcoming 4（每 15 分钟）+ events 1 + previous 1 + 归档 8 = 14，留 1 次余量

# 为什么排四个 cron 点而不是一个：
# GitHub 的 schedule 事件会漏触发（实测本仓库的 18:05 那个点整整漏了一次，
# 而 15 分钟一次的 sync 在同一个时段照常收到）。
# 单次投递率不到 100%，那就多给几次机会 —— 触发点越密，期望命中次数越高。
# 总量不会因此超标：脚本按「距上次跑过多久」折算页数，
# 四个点都命中时各抓 2 页，只命中两个时各抓 4 页，一小时仍是 8 页 = 8 次请求。
#
# push 触发是为了改完脚本立刻跑一次：路径收窄到归档相关的两个文件，
# 平时推业务代码不会碰它。

on:
  schedule:
    # 每小时 4 个触发点，都避开整点那批（整点最挤、最容易延迟）
    - cron: '5,20,35,50 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/archive.js'
      - '.github/workflows/archive.yml'
      # 手机改这个文件即触发一轮维护：schedule 会成片漏投，
      # 想立刻补数据时不用等 cron，也不用开电脑点 Run workflow
      - 'scripts/archive-request.json'
  workflow_dispatch:
    inputs:
      pages:
        description: '本轮抓取页数（每页 100 条）；auto = 按距上次间隔自动折算'
        required: false
        default: 'auto'
        type: string

permissions:
  contents: read

concurrency:
  group: archive-history
  # 排队而不是取消：两个实例同时写 state，会把断点覆盖乱
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # 单轮上限 24 页，每页最长约 60 秒，再留给上传
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: 抓取并归档
        working-directory: scripts
        env:
          LL2_TOKEN: ${{ secrets.LL2_TOKEN }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          COS_ACL: public-read
        run: node archive.js --pages=${{ inputs.pages || 'auto' }}

      # 归档推进后立刻重算统计：stats 独立 cron 一天只跑一次，
      # 会在归档补齐期间长期滞后（2025 年只剩 11/12 月那种）。
      # 纯读 COS 已有分片 + 上传，不碰 LL2，零配额成本。
      - name: 重算年度统计
        if: always()
        working-directory: scripts
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          COS_ACL: public-read
        run: node sync.js --dataset=stats
