name: archive-history

# 历史发射归档
#
# 为什么单独一个 workflow：
# LL2 免费额度 15 次/小时、每次最多 100 条，全部历史 7654 条约 77 页。
# 一次跑完必然 429，所以拆成「每小时跑 8 页、断点续传」，
# 约 10 小时补齐，之后 state.done=true 就自动跳过。
#
# 配额分配（每小时）：
#   upcoming 4（每 15 分钟）+ events 1 + previous 1 + 归档 8 = 14，留 1 次余量

on:
  schedule:
    # 每小时的 5 分钟，避开整点那批
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: '本轮抓取页数（每页 100 条）'
        required: false
        default: '8'
        type: string

permissions:
  contents: read

concurrency:
  group: archive-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # 8 页 × 每页最长约 60 秒，再留给上传
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: 抓取并归档
        working-directory: scripts
        env:
          LL2_TOKEN: ${{ secrets.LL2_TOKEN }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          COS_ACL: public-read
        run: node archive.js --pages=${{ inputs.pages || '8' }}
