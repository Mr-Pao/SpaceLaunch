name: sync-space-data

# 为什么是四条 cron 而不是一条每 15 分钟跑再按分钟取模判断：
# GitHub 的定时触发常态延迟 5-15 分钟，取模判断必然错位（15:00 的任务可能 15:12 才跑，
# 用 分钟%15 会算成"该更新事件"）。改用 github.event.schedule 精确对应本次是哪个 cron 触发的。
#
# 请求预算（LL2 未认证限额 15 次/小时）：
#   upcoming    4 次/小时
#   events      1 次/小时
#   previous    1 次/小时
#   timeline    约 1 次/小时（每 6 小时 6 条单条详情，8 条会在 timeline 轮撞 15 次限额）
#   video       2 次/小时（每轮 10 条发射，detailed 一页 5 条）
#   images      7 次/小时（每轮 7 个请求：1 页最新 + 游标 6 页，原图补齐 + 图库分片）
#   cores       每天 1 轮 2 个请求（detailed，UTC 23:00 = 北京 07:00）
#   astronauts  每天 1 轮 9 个请求（detailed，UTC 23:10 = 北京 07:10）
#   onthisday   0 次 LL2（只读自家 COS 上的快照 + 归档分片），UTC 03:45 = 北京 11:45
#   合计        常规小时 16 次；含 timeline 的小时 21 次；
#               agencies / astronauts 那个小时会短暂到 24，每天一次、429 两三个请求无碍
#               （images 与 timeline 撞在 0/6/12/18 点的那一小时，多出的请求会被 429 挡掉。
#                 images 的游标页失败**不再跳过**：停在最后一个成功位置，下轮重扫，
#                 所以撞配额只会让进度慢一点，不会留下永远扫不到的空洞）
# 注意：images 放每小时的 50 分，错开 timeline（0,6,12,18 点的 20 分）
# 与 video（40 分），尽量不在同一分钟内挤。
#
# images 的额度是刻意倾斜的：图库是用户直接看的东西，150 条/轮要 51 小时才扫完一圈，
# 换成 300 条/轮后约 26 小时。timeline 只是详情页的一小块，放到 6 小时不影响观感。
#
# 注意：cron 用的是 UTC。北京时间 = UTC+8

on:
  schedule:
    - cron: '*/15 * * * *'   # 即将发射：每 15 分钟
    - cron: '15 * * * *'     # 事件：每小时一次（原本 30 分钟，腾出配额给历史归档）
    - cron: '0 * * * *'      # 历史发射：每小时
    - cron: '0 3 * * *'      # 机构：每天 UTC 03:00 = 北京 11:00
    - cron: '30 3 * * *'     # 统计：每天 UTC 03:30 = 北京 11:30（错开机构，避免抢配额）
    - cron: '45 3 * * *'     # 往年今日：每天 UTC 03:45 = 北京 11:45（只读自家 COS，不耗 LL2 配额）
    - cron: '0 20 * * *'     # 即将发射后续排期：每天 UTC 20:00 = 北京 04:00（要 4 个请求）
    - cron: '0 21 * * *'     # 火箭型号库：每天 UTC 21:00 = 北京 05:00（要 6 个请求）
    - cron: '0 22 * * *'     # 发射工位库：每天 UTC 22:00 = 北京 06:00（1 个请求）
    - cron: '0 23 * * *'     # 芯级个体库：每天 UTC 23:00 = 北京 07:00（2 个请求，detailed）
    - cron: '10 23 * * *'    # 宇航员库：每天 UTC 23:10 = 北京 07:10（9 个请求，detailed，错开芯级）
    # 空间站 / 远征队 / 对接事件：每天 UTC 04:25~04:45（北京 12:25~12:45）错峰抓取，
    # 该时段原本只有 onthisday 的 03:45 已结束，单数据集请求数都远低于 15 限额，互不挤占。
    # spacestations 仅 15 条（detailed）、expeditions 165 条分页 2 请求、dockings 分页按数据量。
    - cron: '25 4 * * *'     # 空间站：每天 UTC 04:25 = 北京 12:25
    - cron: '35 4 * * *'     # 远征队：每天 UTC 04:35 = 北京 12:35
    - cron: '45 4 * * *'     # 对接事件：每天 UTC 04:45 = 北京 12:45
    - cron: '20 */6 * * *'   # 发射时间线：每 6 小时（每次 8 条单条详情）
    # 发射视频：每小时。只有 mode=detailed 才返回 vid_urls，一页 5 条约 12 秒，
    # 每轮 10 条 = 2 个请求。定在 40 分，避开其它任务的 0 / 15 / 20 / 30 分
    - cron: '40 * * * *'
    # 发射原图全量补齐 + 全量图库分片：每小时（50 分），每轮 3 个请求。
    # 全量约 7654 条发射，每轮 150 条 → 约 51 轮，两天扫完一圈；
    # 之后游标归零重扫，新发射自动进图库（新发射永远在 offset=0 附近）
    - cron: '50 * * * *'
  # 手动触发（含本机无 API 访问时）：改 scripts/sync-request.json 里的 dataset 再 push 即可。
  # GitHub App / 手机上也能改这个文件，是最省事的"跑一次某数据集"入口。
  push:
    paths:
      - 'scripts/sync-request.json'
  workflow_dispatch:
    inputs:
      dataset:
        description: '要同步的数据集'
        required: true
        default: 'upcoming'
        type: choice
        options:
          - upcoming
          - upcomingMore
          - previous
          - events
          - agencies
          - launchers
          - cores
          - astronauts
          - pads
          - stats
          - onthisday
          - timeline
          - video
          - images
          - spacestations
          - expeditions
          - dockings
          - all

permissions:
  contents: write

concurrency:
  # schedule/dispatch 用数据集名做组，保证同一数据集不并发，避免两次抓取同时写同一个文件。
  # push 手动触发（改 sync-request.json 重跑某数据集）用 commit sha 做组：每次 push 都唯一，
  # 这样连续重跑多个数据集时不会被合并到同一个 sync-push 组里互相取消（踩过坑：三个数据集连推，
  # 中间那个被 concurrency 的"只留最新排队"规则吃掉）。
  group: sync-${{ github.event.schedule || inputs.dataset || github.sha }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 15 分钟对 pads 首轮不够：251 张 map_image 镜像 + 251 段工位简介翻译
    # 都集中在第一次跑；之后按 hash / 翻译缓存跳过，几分钟内结束
    timeout-minutes: 30

    steps:
      # checkout 必须在决定数据集之前：push 触发时数据集名要读 scripts/sync-request.json
      - uses: actions/checkout@v4

      - name: 决定本次要同步哪个数据集
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DS="${{ inputs.dataset }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # 手动触发通道：文件里写 {"dataset":"pads"} 之类的单键对象
            DS=$(node -e "try{console.log(require('./scripts/sync-request.json').dataset||'upcoming')}catch(e){console.log('upcoming')}")
          else
            case "${{ github.event.schedule }}" in
              "*/15 * * * *") DS="upcoming" ;;
              "15 * * * *")   DS="events" ;;
              "0 * * * *")    DS="previous" ;;
              "0 3 * * *")    DS="agencies" ;;
              "30 3 * * *")   DS="stats" ;;
              "45 3 * * *")   DS="onthisday" ;;
              "0 20 * * *")   DS="upcomingMore" ;;
              "0 21 * * *")   DS="launchers" ;;
              "0 22 * * *")   DS="pads" ;;
              "0 23 * * *")   DS="cores" ;;
              "10 23 * * *")  DS="astronauts" ;;
              "25 4 * * *")   DS="spacestations" ;;
              "35 4 * * *")   DS="expeditions" ;;
              "45 4 * * *")   DS="dockings" ;;
              "20 */6 * * *") DS="timeline" ;;
              "40 * * * *")   DS="video" ;;
              "50 * * * *")   DS="images" ;;
              *)              DS="upcoming" ;;
            esac
          fi
          echo "dataset=$DS" >> "$GITHUB_OUTPUT"
          echo "本次同步：$DS"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      # 视频本体转存需要 yt-dlp + ffmpeg（仅 video 任务装，且失败不影响主流程）。
      # 没装成时脚本会自动跳过 YouTube 下载，只保留「复制链接」兜底
      - name: 安装 yt-dlp / ffmpeg（视频可播放，失败可跳过）
        if: steps.pick.outputs.dataset == 'video'
        continue-on-error: true
        run: |
          pip install --quiet yt-dlp || true
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg || true

      - name: 抓取并上传
        working-directory: scripts
        env:
          # 配了 LL2_TOKEN 就自动带上，限额会比 15 次/小时宽松很多
          LL2_TOKEN: ${{ secrets.LL2_TOKEN }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          # 桶名和地域已有默认值，Secret 留空也不影响
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          # 桶本身是私有读，靠单个对象打 public-read 让小程序能拉到
          # 不加这个，CI 上传的文件在浏览器里会 403
          COS_ACL: public-read
          # 描述中文化：CI 在海外节点，Google 免费端点可直连且不限量，
          # auto 表示 Google 挂了自动降级到 MyMemory，两条都挂就保留英文
          TRANSLATE_PROVIDER: auto
          # 时间线每轮抓多少条：timeline 轮 = upcoming 4 + events 1 + previous 1
          # + 单条详情 6 = 12 次；8 条时峰值 16 > 15 会被 429 打断整轮（评审 P1-2）
          TIMELINE_PER_RUN: '6'
          # 视频每轮抓多少条发射：detailed 一页 5 条，10 条 = 2 个请求
          VIDEO_PER_RUN: '10'
          # 视频本体下载（3.2.25）：每轮最多真正发起几次下载（直链 + YouTube 合计）
          # 给 LL2 抓取和脚本其余部分留时间；YouTube 需要 yt-dlp + ffmpeg（见上方安装步骤）
          DL_MAX_PER_RUN: '6'
          YT_DL: '1'
          # 原图全量补齐每轮扫多少条发射：normal 一页 50 条，300 条 = 6 个游标请求
          # + 1 个「补最新」页 = 7 次。这里会覆盖 scripts/images.js 里的默认值，
          # 两处要一起改，否则实际跑的是这里的数字
          IMAGE_PER_RUN: '300'
        run: node sync.js --dataset=${{ steps.pick.outputs.dataset }}

      # GitHub 规定：公开仓库连续 60 天无提交，定时任务会被自动停用。
      # 这里在超过 45 天没提交时补一个空提交，把计时器重置。
      # 若发现仍未生效（GITHUB_TOKEN 推送的提交是否计入活跃度存在争议），
      # 退路是每两个月到 Actions 页面点一次 "Enable workflow"。
      - name: 保活（防止 60 天无提交被停用）
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次提交 $DAYS 天"
          if [ "$DAYS" -ge 45 ]; then
            mkdir -p .keepalive
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-run
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive/last-run
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
