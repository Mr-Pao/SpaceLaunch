name: sync-space-data

# 为什么是四条 cron 而不是一条每 15 分钟跑再按分钟取模判断：
# GitHub 的定时触发常态延迟 5-15 分钟，取模判断必然错位（15:00 的任务可能 15:12 才跑，
# 用 分钟%15 会算成"该更新事件"）。改用 github.event.schedule 精确对应本次是哪个 cron 触发的。
#
# 请求预算（LL2 未认证限额 15 次/小时）：
#   upcoming  4 次/小时
#   events    2 次/小时
#   previous  1 次/小时
#   合计      7 次/小时，留 2 倍余量
#   agencies  每天 1 轮 4 个请求（唯一需要真翻页的数据集）
#
# 注意：cron 用的是 UTC。北京时间 = UTC+8

on:
  schedule:
    - cron: '*/15 * * * *'   # 即将发射：每 15 分钟
    - cron: '*/30 * * * *'   # 事件：每 30 分钟（与上一条同时段触发时靠 schedule 字段区分）
    - cron: '0 * * * *'      # 历史发射：每小时
    - cron: '0 3 * * *'      # 机构：每天 UTC 03:00 = 北京 11:00
  workflow_dispatch:
    inputs:
      dataset:
        description: '要同步的数据集'
        required: true
        default: 'upcoming'
        type: choice
        options:
          - upcoming
          - previous
          - events
          - agencies
          - all

permissions:
  contents: write

concurrency:
  # 同一数据集不并发，避免两次抓取同时写同一个文件
  group: sync-${{ github.event.schedule || inputs.dataset }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 决定本次要同步哪个数据集
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DS="${{ inputs.dataset }}"
          else
            case "${{ github.event.schedule }}" in
              "*/15 * * * *") DS="upcoming" ;;
              "*/30 * * * *") DS="events" ;;
              "0 * * * *")    DS="previous" ;;
              "0 3 * * *")    DS="agencies" ;;
              *)              DS="upcoming" ;;
            esac
          fi
          echo "dataset=$DS" >> "$GITHUB_OUTPUT"
          echo "本次同步：$DS"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: 抓取并上传
        working-directory: scripts
        env:
          # 配了 LL2_TOKEN 就自动带上，限额会比 15 次/小时宽松很多
          LL2_TOKEN: ${{ secrets.LL2_TOKEN }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          # 桶名和地域已有默认值，Secret 留空也不影响
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          # 桶本身是私有读，靠单个对象打 public-read 让小程序能拉到
          # 不加这个，CI 上传的文件在浏览器里会 403
          COS_ACL: public-read
        run: node sync.js --dataset=${{ steps.pick.outputs.dataset }}

      # GitHub 规定：公开仓库连续 60 天无提交，定时任务会被自动停用。
      # 这里在超过 45 天没提交时补一个空提交，把计时器重置。
      # 若发现仍未生效（GITHUB_TOKEN 推送的提交是否计入活跃度存在争议），
      # 退路是每两个月到 Actions 页面点一次 "Enable workflow"。
      - name: 保活（防止 60 天无提交被停用）
        if: github.event_name == 'schedule'
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))
          echo "距上次提交 $DAYS 天"
          if [ "$DAYS" -ge 45 ]; then
            mkdir -p .keepalive
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-run
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .keepalive/last-run
            git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
            git push
          fi
