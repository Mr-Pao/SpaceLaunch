name: nasa-daily

# NASA 每日天文（APOD）+ 每日地球（EPIC）抓取管道。
# 这两个是外部 NASA 数据源（非 LL2），与 GCAT 同属「外部 API、低频更新」，
# 因此单独一条 workflow，不挤占 sync.yml 的 LL2 配额，也不与 gcat.yml 撞车。
#
# 触发方式：
#   1. 定时：每天 UTC 04:00 = 北京 12:00 跑一次（APOD 每天一张 / EPIC 每天一组，每天足够）
#   2. push：改动 scripts/nasa-daily.js 或本工作流文件即触发（首推即跑，不用等 cron）
#   3. 手动：workflow_dispatch 直接跑
#
# 产物（上传到 COS space-data/）：
#   apod.json  近 7 天 APOD 天文图（标题 / 说明 / 缩略图 / 原图 / 署名）
#   epic.json  当天地球全彩图（DSCOVR 拍，取最新一组前几张）
#
# 注意：cron 用 UTC。北京时间 = UTC+8

on:
  schedule:
    - cron: '0 4 * * *'    # 每天 UTC 04:00 = 北京 12:00
  push:
    paths:
      - 'scripts/nasa-daily.js'
      - '.github/workflows/nasa-daily.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nasa-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 7 天 APOD × 每条约 1 秒 + 镜像，15 分钟绰绰有余
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: 抓取 APOD/EPIC 并上传
        working-directory: scripts
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          # 桶本身是私有读，靠单个对象打 public-read 让小程序能拉到
          COS_ACL: public-read
          # NASA API key：DEMO_KEY 有限流，配了 NASA_API_KEY 就优先用它
          NASA_API_KEY: ${{ secrets.NASA_API_KEY || 'DEMO_KEY' }}
        run: node nasa-daily.js
