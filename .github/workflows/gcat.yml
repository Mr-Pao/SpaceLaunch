name: sync-gcat

# GCAT（卫星/航天器编目）抓取管道。
# 数据特性：GCAT 是人工维护的季度级更新编目（Release 1.8.8 数据更新 2026-10-25），
# 与 LL2 的小时级实时发射数据完全不同，因此单独一条 workflow，不挤占 sync.yml 的 LL2 配额。
#
# 触发方式：
#   1. 定时：每月 1 号 UTC 04:00 = 北京 12:00 跑一次（季度更新，月度足够新鲜，几乎零成本）
#   2. push：改动 scripts/gcat.js 或本工作流文件即触发（首推即跑，不用等月度 cron）
#   3. 手动：workflow_dispatch 直接跑
#
# 产物（上传到 COS space-data/）：
#   satellites.json + satellites/{i}.json  卫星百科（在轨航天器/载荷，按发射倒序分片）
#   orbit-stats.json                       全球在轨资产聚合（按国家/轨道/年代）
#   debris-events.json                     在轨解体/再入事件流（按再入日期排序）
#
# 注意：cron 用 UTC。北京时间 = UTC+8

on:
  schedule:
    - cron: '0 4 1 * *'    # 每月 1 号 UTC 04:00 = 北京 12:00
  push:
    paths:
      - 'scripts/gcat.js'
      - '.github/workflows/gcat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gcat
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 解析 7 万行定宽文本 + 上传 40+ 分片很快，15 分钟绰绰有余
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        working-directory: scripts
        run: npm install --no-audit --no-fund

      - name: 抓取 GCAT 并上传
        working-directory: scripts
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET || 'spacelaunch-1258113633' }}
          COS_REGION: ${{ secrets.COS_REGION || 'ap-chengdu' }}
          # 桶本身是私有读，靠单个对象打 public-read 让小程序能拉到
          COS_ACL: public-read
        run: node gcat.js
